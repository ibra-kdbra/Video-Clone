<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="FundaStream: watch YouTube, Dailymotion and Twitch clips in one calm, fast feed." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>FundaStream</title>
    <!-- Applies the saved (or system) theme before the first paint. Allowed by its hash in the
         Content-Security-Policy (netlify.toml); tests/security.test.mjs checks they match. -->
    <script>(function(){try{var t=JSON.parse(localStorage.getItem('fs.theme')||'null');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(t==='light')document.querySelector('meta[name="theme-color"]').content='#fafafa'}catch(e){}})()</script>
  </head>
  <body>
    <noscript>FundaStream needs JavaScript to play videos.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
