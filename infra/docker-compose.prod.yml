# Production on one small server (Oracle Cloud Always Free, see docs/deploy.md): the API, the
# worker, Postgres, Redis, Garage (video storage) and Caddy (HTTPS). Only Caddy is reachable from
# outside.
#
#   cp infra/.env.prod.example infra/.env.prod   # fill it in
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#
# The values in .env.prod fill in the ${...} below; nothing reads the file directly.
name: grand-lms

x-env: &env
  NODE_ENV: production
  DATABASE_URL: postgres://grand_app:${APP_DB_PASSWORD}@postgres:5432/grand
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

# The video bucket in Garage, reached inside the server's network.
x-s3: &s3
  S3_ENDPOINT: http://garage:3900
  S3_REGION: garage
  S3_BUCKET: grand-media
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}

# Each container gets only the settings it needs (the database owner's password stays with Postgres
# and the migration job), runs on a read-only filesystem, and can't gain privileges.
x-app: &app
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
    storage-setup: { condition: service_completed_successfully }
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN, such as grand-lms.duckdns.org}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set MEDIA_DOMAIN, such as media.grand-lms.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, garage]

  api:
    <<: *app
    build: { context: .., dockerfile: Dockerfile, target: api }
    environment:
      <<: [*env, *s3]
      # Browsers fetch videos from here; signed URLs name this host.
      S3_PUBLIC_ENDPOINT: https://${MEDIA_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WEB_ORIGINS: ${WEB_ORIGINS:?Set WEB_ORIGINS}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL}
      HOST: 0.0.0.0
      PORT: "3000"
      # Caddy is the one proxy in front of the API. Requests that came through Netlify carry the
      # visitor's address in this header; without it, everyone would share Netlify's addresses.
      TRUST_PROXY: "1"
      CLIENT_IP_HEADER: x-nf-client-connection-ip
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    build: { context: .., dockerfile: Dockerfile, target: worker }
    environment:
      <<: [*env, *s3]
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      # Videos transcoded at once, and the threads each may use. The Always Free server's four
      # cores handle two at a time without slowing the API.
      TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
      TRANSCODE_THREADS: ${TRANSCODE_THREADS:-2}
    # Originals and transcoded files are written here before they go to Garage: a disk, not
    # memory like /tmp.
    volumes: [media_work:/work]

  # Applies pending migrations as the database owner, then exits. Every `up` runs it first.
  migrate:
    build: { context: .., dockerfile: Dockerfile, target: api }
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_MIGRATION_URL: postgres://grand:${POSTGRES_PASSWORD}@postgres:5432/grand
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Gets Garage ready (storage role, bucket, key, CORS for WEB_ORIGINS), then exits. Safe to rerun.
  storage-setup:
    build: { context: .., dockerfile: Dockerfile, target: api }
    command: ["node", "dist/storage/setup.js"]
    environment:
      <<: *s3
      WEB_ORIGINS: ${WEB_ORIGINS:?Set WEB_ORIGINS}
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN}
    depends_on:
      garage: { condition: service_healthy }
    restart: "no"

  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: grand
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grand -d grand"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  postgres:
  redis:
  garage_meta:
  garage_data:
  media_work:
  caddy_data:
  caddy_config:
