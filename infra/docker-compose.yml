# Local development services: `npm run infra:up`, then `npm run storage:setup` once to create the
# video bucket. The API and worker run on your machine (npm run dev:api / dev:worker) against these.
name: grand-lms-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grand
      POSTGRES_PASSWORD: grand
      POSTGRES_DB: grand
      APP_DB_PASSWORD: grand_app
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grand -d grand"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Catches every email the worker sends: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # S3-compatible storage for videos (http://localhost:3900) and its admin API (3903), which
  # `npm run storage:setup` uses.
  garage:
    image: dxflrs/garage:v2.1.0
    ports: ["127.0.0.1:3900:3900", "127.0.0.1:3903:3903"]
    volumes:
      - ./garage/garage.dev.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # LiveKit for live classes over WebRTC, in development mode (keys devkey / secret). Set
  # LIVEKIT_URL=ws://localhost:7880, LIVEKIT_API_KEY=devkey and LIVEKIT_API_SECRET=secret for the API.
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports: ["127.0.0.1:7880:7880", "127.0.0.1:7881:7881", "127.0.0.1:7882:7882/udp"]

volumes:
  postgres:
  redis:
  garage_meta:
  garage_data:
