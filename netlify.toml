# Grand LMS on Netlify: the web app (apps/web) and its video proxy function, which looks up the
# title, pictures and length of the YouTube, Dailymotion and Twitch videos that lessons embed. The
# NestJS API runs on its own server (see docs/deploy.md); the build proxies /api/v1/* to it when
# API_ORIGIN is set.
[build]
  command = "npm run build -w @grand/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # The public site has no API server: it runs the LMS against a mock API in the browser, with a
  # demo school (apps/web/src/demo). Leave this out once API_ORIGIN points at a real API.
  VITE_DEMO = "true"

# The video proxy (apps/web/netlify/functions/api.mjs) serves /api/* except /api/v1/*, which is the
# Grand LMS API. The security headers and redirects are written into dist/ by the build
# (apps/web/scripts/netlify-files.mjs), so the Content-Security-Policy can name the API's server.
[functions]
  directory = "apps/web/netlify/functions"
